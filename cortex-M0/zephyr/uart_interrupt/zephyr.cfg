system.name = usima
system.desc = Single-core Cortex-M0 bare-metal zephyr benchmark
system.config = ${cfg}
system.quantum = 10ms

system.throttle.rtf = 0.0
system.loader.images = ${dir}/build/zephyr.elf
system.cpu.core0.symbols = ${dir}/build/zephyr.elf

system.cpu.core0.gdb_port = 5555
system.cpu.core0.gdb_wait = true

system.term.backends = tui
system.cpu.core0.semihosting = true

# CAN configuration
#system.canbridge.backends = file
